name: tcrpmhc-vicreg
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.13.1
  - scikit-learn=1.7.2
  - matplotlib=3.9.1
  - networkx=3.4.2
  - pyyaml
  - pip:
      # Install the CUDA 12.8 build used for the reported results:
      #   pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.0
      # Only needed for the two ESMC input families.
      - esm==3.2.1.post1
      - peft==0.17.1
      - transformers==4.48.1
      - huggingface-hub==0.35.3
